## ROCK_Wall_Climbing_example.toml - every option with its default and help
## Reference only: the mod never reads this file. The first time it starts it writes this same text as
## ROCK_Wall_Climbing.toml in Documents\My Games\Fallout4VR\Mods_Config\ROCK_Wall_Climbing.

## === 01. General ===
[General]
## Turns wall climbing on.
Enabled = true

## 0=off, 1=errors, 2=info, 3=debug, 4=trace.
LogLevel = 2

## === 02. Climbing ===
[Climbing]
## Player displacement per unit of inverse tracked-hand displacement. Range: 0.1 to 2.
MovementScale = 1.0

## Base target-follow speed; response increases adaptively during larger pulls. Range: 1 to 80.
SmoothingSpeed = 13.0

## A larger per-frame hand or anchor jump, in game units, is treated as a tracking discontinuity. Range: 2 to 100.
MaximumHandDeltaGameUnits = 24.0

## Rebase instead of correcting toward a stale target after a teleport or correction, in game units. Range: 20 to 500.
MaximumTargetSeparationGameUnits = 96.0

## Headset clearance kept along ROCK's guarded world raycast, in game units. Range: 0 to 40.
HeadClearanceGameUnits = 12.0

## Carry the player with a grabbed moving (keyframed) surface.
FollowMovingSurfaces = true

## === 03. Launch ===
[Launch]
## Letting go while pulling launches you along the pull.
Enabled = true

## Seconds of hand motion the launch velocity is measured over. Range: 0.03 to 0.5.
VelocityHistorySeconds = 0.1

## Hand motion further than this many degrees from the launch direction is ignored. Range: 0 to 180.
DirectionFilterDegrees = 75.0

## Scales the launch speed. Range: 0 to 3.
Multiplier = 1.15

## Scales the horizontal part of the launch. Range: 0 to 3.
HorizontalBoost = 1.05

## Slower releases do not launch; never more than MaximumSpeedGameUnitsPerSecond. Range: 0 to 500.
MinimumSpeedGameUnitsPerSecond = 35.0

## Fastest launch. Range: 1 to 1200.
MaximumSpeedGameUnitsPerSecond = 450.0

## === 04. Diagnostics ===
[Diagnostics]
## Logs bounded, sampled movement telemetry. Off for normal play.
DetailedTelemetry = false
