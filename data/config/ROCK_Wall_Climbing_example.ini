; Human-reference configuration only.
; The plugin never reads or deploys this file.
; Active path:
; Documents\My Games\Fallout4VR\Mods_Config\ROCK_Wall_Climbing\ROCK_Wall_Climbing.ini

[General]
bEnabled = true
; 0=off, 1=errors, 2=info, 3=debug, 4=trace
iLogLevel = 2

[Climbing]
; Player displacement per unit of inverse tracked-hand displacement.
fMovementScale = 1.0
; Base target-follow speed; response increases adaptively during larger pulls.
fSmoothingSpeed = 13.0
; A larger per-frame hand/anchor jump is treated as tracking discontinuity.
fMaximumHandDeltaGameUnits = 24.0
; Rebase instead of correcting toward a stale target after teleport/correction.
fMaximumTargetSeparationGameUnits = 96.0
; HMD clearance retained along ROCK's guarded world raycast.
fHeadClearanceGameUnits = 12.0
; Carry the player with a grabbed keyframed surface.
bFollowMovingSurfaces = true

[Launch]
bEnabled = true
fVelocityHistorySeconds = 0.10
fDirectionFilterDegrees = 75.0
fMultiplier = 1.15
fHorizontalBoost = 1.05
fMinimumSpeedGameUnitsPerSecond = 35.0
fMaximumSpeedGameUnitsPerSecond = 450.0

[Diagnostics]
; Fail-closed default. Emits only bounded sampled movement telemetry when true.
bDetailedTelemetry = false
